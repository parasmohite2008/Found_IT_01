<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FoundIt</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui,"Noto Sans Devanagari",sans-serif;background:#e0e7ff}.in{width:100%;background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:12px;font-size:14px;outline:none;margin-bottom:12px}.in:focus{border-color:#6366f1}.btn{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:800;padding:14px;border-radius:14px;width:100%}.btn:disabled{opacity:.5}.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 2px 14px #6366f126;margin-bottom:12px}.chip{font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;color:#fff}.hide{display:none}.tab{flex:1;padding:10px;font-size:11px;font-weight:700;color:#94a3b8}.on{color:#4f46e5}</style></head>
<body><div class="max-w-md mx-auto min-h-screen bg-slate-50 relative pb-20">
<div id="auth" class="p-8 pt-24 text-center"><h1 class="text-4xl font-black text-indigo-600 mb-1">FoundIt</h1><p class="text-xs text-slate-400 mb-8">Lost it? Found it? Return it.</p>
<input id="em" type="email" class="in" data-p="email"><input id="pw" type="password" class="in" data-p="password">
<button id="lg" class="btn mb-3" data-i="login"></button><button id="rg" class="text-sm font-bold text-slate-500" data-i="create"></button></div>
<div id="app" class="hide">
<header class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-4 pt-8 rounded-b-3xl"><div class="flex justify-between items-center"><h1 class="text-2xl font-black">FoundIt</h1>
<select id="lang" class="bg-white/20 rounded-lg text-xs font-bold p-2 outline-none"><option value="0" class="text-black">English</option><option value="1" class="text-black">हिन्दी</option><option value="2" class="text-black">मराठी</option></select></div>
<div id="stats" class="grid grid-cols-3 gap-2 mt-4 text-center text-[10px] font-bold"></div></header>
<main class="p-4">
<section id="home"><input id="q" class="in" data-p="search"><div class="flex gap-2"><select id="ft" class="in"></select><select id="fc" class="in"></select></div><div id="list"></div></section>
<section id="det" class="hide"><button id="bk" class="text-indigo-600 font-bold text-sm mb-3" data-i="back"></button><div id="dc"></div></section>
<section id="post" class="hide"><div class="flex gap-2 mb-3"><button id="tl" class="flex-1 p-3 rounded-xl font-bold text-xs" data-i="lost"></button><button id="tf" class="flex-1 p-3 rounded-xl font-bold text-xs" data-i="found"></button></div>
<label class="block card text-center text-xs font-bold text-indigo-600">📷 <span data-i="photo"></span><input id="ph" type="file" accept="image/*" class="hide"></label>
<input id="ti" class="in" data-p="ptitle"><textarea id="de" class="in h-16" data-p="pdesc"></textarea><textarea id="se" class="in h-20 hide bg-orange-50" data-p="psecret"></textarea>
<select id="ca" class="in"></select><input id="lo" class="in" data-p="pwhere"><input id="pn" type="tel" class="in" data-p="pphone"><button id="sb" class="btn" data-i="submit"></button></section>
<section id="me" class="hide"><div class="card"><p id="ue" class="font-black truncate"></p></div><button id="lo2" class="w-full text-red-500 font-bold p-3 mb-3" data-i="logout"></button><h3 class="font-black mb-2" data-i="mine"></h3><div id="mine"></div></section>
</main>
<nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex pb-[env(safe-area-inset-bottom)]"><button class="tab" data-go="home">🏠<br><span data-i="home"></span></button><button class="tab" data-go="post">➕<br><span data-i="post"></span></button><button class="tab" data-go="me">👤<br><span data-i="me"></span></button></nav></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword as reg,signInWithEmailAndPassword as login,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,query,orderBy,limit,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getFunctions,httpsCallable}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
const app=initializeApp({apiKey:"AIzaSyCaQVBo1ySGYme84ujN8v6dMZdGwRGefa8",authDomain:"lost-and-found-a53a3.firebaseapp.com",projectId:"lost-and-found-a53a3"});
const auth=getAuth(app),db=getFirestore(app),fns=getFunctions(app,"us-central1");
const call=async(n,d)=>(await httpsCallable(fns,n)(d)).data,$=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T={login:["Login","लॉगिन","लॉगिन"],create:["Create Account","खाता बनाएँ","खाते उघडा"],email:["Email","ईमेल","ईमेल"],password:["Password","पासवर्ड","पासवर्ड"],search:["Search...","खोजें...","शोधा..."],all:["All","सभी","सर्व"],lost:["Lost","खोया","हरवले"],found:["Found","मिला","सापडले"],home:["Home","होम","मुख्य"],post:["Post","पोस्ट","पोस्ट"],me:["Profile","प्रोफ़ाइल","प्रोफाइल"],ptitle:["What did you lose / find?","आपने क्या खोया / पाया?","काय हरवले / सापडले?"],pdesc:["Public details","सार्वजनिक विवरण","सार्वजनिक तपशील"],psecret:["Secret details (min 3 points, hidden)","गुप्त विवरण (कम से कम 3 बातें, छिपा हुआ)","गुप्त तपशील (किमान 3 मुद्दे, लपवलेले)"],pwhere:["Where (area, building)?","कहाँ (क्षेत्र, भवन)?","कुठे (परिसर, इमारत)?"],pphone:["Phone number","फ़ोन नंबर","फोन नंबर"],photo:["Autofill from photo (AI)","फ़ोटो से भरें (AI)","फोटोवरून भरा (AI)"],submit:["Submit","जमा करें","सबमिट करा"],apply:["Claim this item","इस वस्तु पर दावा करें","या वस्तूवर दावा करा"],back:["← Back","← वापस","← मागे"],verify:["Answer to prove ownership","मालिकाना हक़ साबित करने हेतु उत्तर दें","मालकी सिद्ध करण्यासाठी उत्तरे द्या"],send:["Submit answers","उत्तर जमा करें","उत्तरे सबमिट करा"],okmsg:["Verified! Finder's phone:","सत्यापित! खोजने वाले का फ़ोन:","पडताळणी यशस्वी! शोधकर्त्याचा फोन:"],failmsg:["Wrong answers. Attempts left:","गलत उत्तर। शेष प्रयास:","चुकीची उत्तरे. उरलेले प्रयत्न:"],lockmsg:["Locked after 3 failed attempts.","3 गलत प्रयासों के बाद लॉक।","3 चुकीच्या प्रयत्नांनंतर लॉक."],pending:["Pending","लंबित","प्रलंबित"],resolved:["Resolved","सुलझा","सुटले"],mine:["My reports","मेरी रिपोर्ट","माझे अहवाल"],logout:["Logout","लॉगआउट","लॉगआउट"],s1:["Reports","रिपोर्ट","अहवाल"],s2:["Recovered","वापस मिले","परत मिळाले"],s3:["Success","सफलता","यशस्वी"],match:["Possible matches","संभावित मिलान","संभाव्य जुळण्या"],resolve:["Resolve","सुलझाएँ","सोडवा"],reopen:["Reopen","फिर खोलें","पुन्हा उघडा"],del:["Delete","हटाएँ","हटवा"],wait:["Please wait...","कृपया प्रतीक्षा करें...","कृपया थांबा..."],fill:["Fill all required fields","सभी आवश्यक जानकारी भरें","सर्व आवश्यक माहिती भरा"],yphone:["Your phone number","आपका फ़ोन नंबर","तुमचा फोन नंबर"]};
const C={Electronics:["💻 Electronics","💻 इलेक्ट्रॉनिक्स","💻 इलेक्ट्रॉनिक्स"],Wallets:["👛 Wallets","👛 पर्स","👛 पाकीट"],Documents:["📄 Documents","📄 दस्तावेज़","📄 कागदपत्रे"],Keys:["🔑 Keys","🔑 चाबियाँ","🔑 चाव्या"],Bags:["🎒 Bags","🎒 बैग","🎒 बॅग"],Other:["📦 Other","📦 अन्य","📦 इतर"]};
let L=+localStorage.lang||0,user,items=[],type="Lost",cur=null,page="home";const t=k=>T[k][L];
function opts(el,list,all){const v=el.value;el.innerHTML=(all?`<option value="All">${t("all")}</option>`:"")+list.map(k=>`<option value="${k}">${all==="t"?"":""}${C[k]?C[k][L]:t(k.toLowerCase())}</option>`).join("");if(v)el.value=v}
function lang(){localStorage.lang=L;$("lang").value=L;document.documentElement.lang=["en","hi","mr"][L];
document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
const ft=$("ft"),v=ft.value;ft.innerHTML=`<option value="All">${t("all")}</option><option value="Lost">${t("lost")}</option><option value="Found">${t("found")}</option>`;ft.value=v||"All";
opts($("fc"),Object.keys(C),1);opts($("ca"),Object.keys(C));setType(type);render()}
function go(p){page=p;["home","det","post","me"].forEach(s=>$(s).classList.toggle("hide",s!==p));document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.go===(p==="det"?"home":p)))}
function setType(x){type=x;$("tl").className="flex-1 p-3 rounded-xl font-bold text-xs "+(x==="Lost"?"bg-red-500 text-white":"bg-slate-100 text-slate-500");$("tf").className="flex-1 p-3 rounded-xl font-bold text-xs "+(x==="Found"?"bg-emerald-500 text-white":"bg-slate-100 text-slate-500");$("se").classList.toggle("hide",x!=="Found")}
const badge=i=>`<span class="chip ${i.type==="Lost"?"bg-red-500":"bg-emerald-500"}">${t(i.type.toLowerCase())}</span> <span class="chip ${i.status==="Resolved"?"bg-slate-400":"bg-orange-500"}">${t(i.status.toLowerCase())}</span>`;
function render(){const k=$("q").value.toLowerCase(),ty=$("ft").value,ca=$("fc").value,r=items.filter(i=>i.status==="Resolved").length;
$("stats").innerHTML=[[items.length,"s1"],[r,"s2"],[(items.length?Math.round(r*100/items.length):0)+"%","s3"]].map(([n,l])=>`<div class="bg-white/15 rounded-xl p-2"><div class="text-lg font-black">${n}</div>${t(l)}</div>`).join("");
$("list").innerHTML=items.filter(i=>(i.title+" "+i.desc).toLowerCase().includes(k)&&(ty==="All"||i.type===ty)&&(ca==="All"||i.category===ca)).map(i=>`<div class="card cursor-pointer" data-id="${esc(i.id)}"><div class="flex justify-between"><b>${esc(i.title)}</b><span>${badge(i)}</span></div><p class="text-xs text-slate-500 my-2 line-clamp-2">${esc(i.desc)}</p><p class="text-[11px] text-slate-400">📍 ${esc(i.location)||"—"} · ${esc((C[i.category]||C.Other)[L])}</p></div>`).join("");
$("mine").innerHTML=items.filter(i=>i.owner===user?.uid).map(i=>`<div class="card flex justify-between items-center text-xs"><b>${esc(i.title)}</b><span><button data-a="${i.status==="Resolved"?"reopen":"resolve"}" data-id="${esc(i.id)}" class="text-indigo-600 font-bold mr-3">${t(i.status==="Resolved"?"reopen":"resolve")}</button><button data-a="delete" data-id="${esc(i.id)}" class="text-red-500 font-bold">${t("del")}</button></span></div>`).join("")}
function detail(id){cur=items.find(i=>i.id===id);const i=cur;if(!i)return;const open=i.type==="Found"&&i.status==="Pending"&&i.owner!==user.uid;
$("dc").innerHTML=`<div class="card"><h2 class="text-xl font-black mb-2">${esc(i.title)}</h2>${badge(i)}<p class="text-sm my-3 text-slate-600">${esc(i.desc)}</p><p class="text-xs text-slate-400">📍 ${esc(i.location)||"—"}</p>${i.type==="Lost"&&i.phone?`<p class="mt-3 font-bold">📞 ${esc(i.phone)}</p>`:""}</div>${open?`<button id="ap" class="btn">${t("apply")}</button>`:""}<div id="cl"></div>`;go("det")}
async function busy(b,f){const o=b.textContent;b.disabled=1;b.textContent=t("wait");try{return await f()}catch(e){alert(e.message)}finally{b.disabled=0;b.textContent=o}}
async function claim(b){const{questions:qs}=await call("startClaim",{id:cur.id});b.classList.add("hide");
$("cl").innerHTML=`<div class="card mt-3"><p class="font-black text-indigo-600 text-xs mb-3">🛡️ ${t("verify")}</p>${qs.map((q,n)=>`<p class="font-bold text-sm mt-3">${n+1}. ${esc(q.q[["en","hi","mr"][L]])}</p>${q.o.map((o,j)=>`<label class="block p-3 border rounded-xl my-1 text-xs"><input type="radio" name="q${n}" value="${j}"> ${esc(o[["en","hi","mr"][L]])}</label>`).join("")}`).join("")}<input id="cp" type="tel" class="in mt-3" placeholder="${t("yphone")}"><button id="sa" class="btn">${t("send")}</button></div>`;
$("sa").onclick=e=>busy(e.target,async()=>{const a=qs.map((_,n)=>{const r=document.querySelector(`input[name=q${n}]:checked`);return r?+r.value:-1});if(a.includes(-1)||!$("cp").value)return alert(t("fill"));
const r=await call("submitClaim",{id:cur.id,answers:a,phone:$("cp").value});$("cl").innerHTML=`<div class="card mt-3 text-center">${r.ok?`<p class="font-black text-emerald-600">✅ ${t("okmsg")}<br><span class="text-2xl">${esc(r.phone)}</span></p>`:`<p class="font-black text-red-600">❌ ${r.left>0?t("failmsg")+" "+r.left:t("lockmsg")}</p>`}</div>`})}
// events
$("list").onclick=e=>{const c=e.target.closest("[data-id]");c&&detail(c.dataset.id)};
$("dc").onclick=e=>{if(e.target.id==="ap")busy(e.target,()=>claim(e.target))};
$("mine").onclick=e=>{const b=e.target.closest("[data-a]");if(b&&(b.dataset.a!=="delete"||confirm("?")))busy(b,()=>call("setStatus",{id:b.dataset.id,action:b.dataset.a}))};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.go));
$("bk").onclick=()=>go("home");$("tl").onclick=()=>setType("Lost");$("tf").onclick=()=>setType("Found");
$("lang").onchange=e=>{L=+e.target.value;lang()};["q","ft","fc"].forEach(i=>$(i).oninput=render);
$("lg").onclick=()=>login(auth,$("em").value,$("pw").value).catch(e=>alert(e.message));$("rg").onclick=()=>reg(auth,$("em").value,$("pw").value).catch(e=>alert(e.message));$("lo2").onclick=()=>signOut(auth);
$("ph").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>busy($("sb"),async()=>{const c=document.createElement("canvas"),s=Math.min(1,800/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
const r=await call("analyzePhoto",{image:c.toDataURL("image/jpeg",.7).split(",")[1]});$("ti").value=r.title||"";$("de").value=r.desc||"";if(C[r.category])$("ca").value=r.category});im.src=URL.createObjectURL(f)};
$("sb").onclick=e=>busy(e.target,async()=>{if(!$("ti").value||!$("pn").value||(type==="Found"&&!$("se").value))return alert(t("fill"));
const r=await call("createItem",{type,title:$("ti").value,desc:$("de").value,secret:$("se").value,category:$("ca").value,location:$("lo").value,phone:$("pn").value});
["ti","de","se","lo","pn"].forEach(i=>$(i).value="");go("home");
if(r.matches.length)alert(t("match")+":\n"+r.matches.map(m=>"• "+m.title).join("\n"))});
onAuthStateChanged(auth,u=>{user=u;$("auth").classList.toggle("hide",!!u);$("app").classList.toggle("hide",!u);if(u){$("ue").textContent=u.email;lang();go("home");
onSnapshot(query(collection(db,"items"),orderBy("ts","desc"),limit(100)),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()})}});
lang();
</script></body></html>
